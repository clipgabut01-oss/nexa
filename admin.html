<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NEXA Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #070707;
  color: white;
  font-family: Arial, sans-serif;
}

.container {
  width: 92%;
  max-width: 1150px;
  margin: auto;
  padding: 35px 0;
}

h1 {
  margin: 0;
}

.subtitle {
  color: #777;
  margin-top: 7px;
}

.box {
  background: #101010;
  border: 1px solid #242424;
  border-radius: 16px;
  padding: 20px;
  margin-top: 20px;
}

label {
  display: block;
  color: #aaa;
  margin-top: 15px;
  margin-bottom: 7px;
  font-size: 14px;
}

input {
  width: 100%;
  padding: 14px;
  background: #151515;
  border: 1px solid #333;
  border-radius: 10px;
  color: white;
  font-size: 15px;
}

button {
  border: 0;
  border-radius: 10px;
  padding: 12px 16px;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  opacity: .4;
  cursor: not-allowed;
}

.primary {
  background: white;
  color: black;
}

.secondary {
  background: #202020;
  color: white;
  border: 1px solid #333;
}

.success-btn {
  background: #102a20;
  color: #00e887;
  border: 1px solid #18563d;
}

.warning-btn {
  background: #302711;
  color: #ffc857;
  border: 1px solid #59491d;
}

.danger {
  background: #261111;
  color: #ff7777;
  border: 1px solid #512222;
}

.success {
  color: #00e887 !important;
}

.error {
  color: #ff5555 !important;
}

#loginPage {
  max-width: 420px;
  margin: 70px auto;
}

#dashboard {
  display: none;
}

#loginBtn {
  width: 100%;
  margin-top: 20px;
}

.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
  flex-wrap: wrap;
}

.stats {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 15px;
  margin-top: 25px;
}

.stat {
  background: #101010;
  border: 1px solid #242424;
  border-radius: 14px;
  padding: 20px;
}

.stat-title {
  color: #777;
  font-size: 13px;
}

.stat-value {
  font-size: 28px;
  font-weight: bold;
  margin-top: 8px;
}

.row {
  display: flex;
  gap: 10px;
  align-items: end;
}

.row > div {
  flex: 1;
}

.toolbar {
  display: flex;
  gap: 10px;
  margin-top: 25px;
  flex-wrap: wrap;
}

.toolbar input {
  flex: 1;
  min-width: 220px;
}

.cards {
  display: grid;
  gap: 14px;
  margin-top: 20px;
}

.card {
  background: #101010;
  border: 1px solid #242424;
  border-radius: 14px;
  padding: 18px;
}

.card-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}

.card-code {
  font-size: 19px;
  font-weight: bold;
}

.badge {
  padding: 6px 10px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: bold;
}

.active {
  background: #0e2c20;
  color: #00e887;
}

.inactive {
  background: #302711;
  color: #ffc857;
}

.details {
  color: #888;
  margin-top: 12px;
  line-height: 1.7;
}

.production {
  margin-top: 15px;
  padding: 13px;
  border-radius: 10px;
  background: #0b0b0b;
  border: 1px solid #202020;
}

.production-title {
  font-size: 12px;
  color: #777;
  margin-bottom: 10px;
}

.production-status {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.mini-status {
  padding: 6px 9px;
  border-radius: 8px;
  background: #191919;
  color: #777;
  font-size: 12px;
}

.mini-status.done {
  background: #102a20;
  color: #00e887;
}

.actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 15px;
}

.production-actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 12px;
}

.empty {
  text-align: center;
  color: #777;
  padding: 30px;
}

#qrHidden {
  position: fixed;
  left: -99999px;
  top: -99999px;
}

@media(max-width:650px) {

  .stats {
    grid-template-columns: 1fr;
  }

  .row {
    flex-direction: column;
    align-items: stretch;
  }

  .actions button,
  .production-actions button {
    flex: 1;
  }

}
</style>
</head>

<body>


<!-- LOGIN -->

<div id="loginPage" class="container">

  <h1>NEXA</h1>
  <p class="subtitle">Admin Dashboard</p>

  <div class="box">

    <label>Email Admin</label>
    <input id="email" type="email">

    <label>Password</label>
    <input id="password" type="password">

    <button id="loginBtn" class="primary">
      LOGIN ADMIN
    </button>

    <p id="loginStatus"></p>

  </div>

</div>



<!-- DASHBOARD -->

<div id="dashboard">

<div class="container">

  <div class="topbar">

    <div>
      <h1>NEXA Admin</h1>
      <p class="subtitle">
        Manajemen Produksi Kartu Google Review
      </p>
    </div>

    <button id="logoutBtn" class="secondary">
      LOGOUT
    </button>

  </div>


  <!-- STATISTIK -->

  <div class="stats">

    <div class="stat">
      <div class="stat-title">TOTAL KARTU</div>
      <div class="stat-value" id="totalCards">0</div>
    </div>

    <div class="stat">
      <div class="stat-title">ACTIVE</div>
      <div class="stat-value" id="activeCards">0</div>
    </div>

    <div class="stat">
      <div class="stat-title">INACTIVE</div>
      <div class="stat-value" id="inactiveCards">0</div>
    </div>

  </div>


  <!-- SATU KARTU -->

  <div class="box">

    <strong>Tambah Satu Kartu</strong>

    <div class="row">

      <div>
        <label>Kode Kartu</label>
        <input
          id="newCardCode"
          placeholder="Contoh: CARD006"
        >
      </div>

      <div>
        <button id="createBtn" class="primary">
          TAMBAH KARTU
        </button>
      </div>

    </div>

  </div>


  <!-- BULK -->

  <div class="box">

    <strong>Buat Banyak Kartu</strong>

    <div class="row">

      <div>
        <label>Nomor Awal</label>
        <input
          id="bulkStart"
          type="number"
          min="1"
          placeholder="Contoh: 6"
        >
      </div>

      <div>
        <label>Jumlah Kartu</label>
        <input
          id="bulkCount"
          type="number"
          min="1"
          max="500"
          placeholder="Contoh: 20"
        >
      </div>

      <div>
        <button id="bulkBtn" class="primary">
          BUAT BANYAK
        </button>
      </div>

    </div>

  </div>


  <!-- QR -->

  <div class="box">

    <strong>QR Produksi</strong>

    <p style="color:#777;font-size:13px;">
      Download QR semua kartu yang masih INACTIVE.
    </p>

    <button id="downloadQrBtn" class="primary">
      DOWNLOAD ZIP QR INACTIVE
    </button>

  </div>


  <p id="status"></p>


  <!-- SEARCH -->

  <div class="toolbar">

    <input
      id="searchInput"
      placeholder="Cari CARD001 atau nama bisnis..."
    >

    <button id="refreshBtn" class="secondary">
      REFRESH
    </button>

  </div>


  <div id="cardsContainer" class="cards"></div>

</div>

</div>


<div id="qrHidden"></div>



<script>

const SUPABASE_URL =
  "https://ksalsojmvyqwhbcggejy.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_BAk8-o_novmk_D73RnX26Q_cju3IBO6";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


let cards = [];


const loginPage =
  document.getElementById("loginPage");

const dashboard =
  document.getElementById("dashboard");

const emailInput =
  document.getElementById("email");

const passwordInput =
  document.getElementById("password");

const loginBtn =
  document.getElementById("loginBtn");

const loginStatus =
  document.getElementById("loginStatus");

const logoutBtn =
  document.getElementById("logoutBtn");

const statusEl =
  document.getElementById("status");

const cardsContainer =
  document.getElementById("cardsContainer");

const totalCards =
  document.getElementById("totalCards");

const activeCards =
  document.getElementById("activeCards");

const inactiveCards =
  document.getElementById("inactiveCards");

const newCardCode =
  document.getElementById("newCardCode");

const createBtn =
  document.getElementById("createBtn");

const bulkStart =
  document.getElementById("bulkStart");

const bulkCount =
  document.getElementById("bulkCount");

const bulkBtn =
  document.getElementById("bulkBtn");

const searchInput =
  document.getElementById("searchInput");

const refreshBtn =
  document.getElementById("refreshBtn");

const downloadQrBtn =
  document.getElementById("downloadQrBtn");

const qrHidden =
  document.getElementById("qrHidden");



function setStatus(text,type="") {

  statusEl.textContent = text;
  statusEl.className = type;

}



function showLogin() {

  loginPage.style.display = "block";
  dashboard.style.display = "none";

}



function showDashboard() {

  loginPage.style.display = "none";
  dashboard.style.display = "block";

}



// =============================
// SESSION
// =============================

async function checkSession() {

  const {
    data:{session}
  } =
  await supabaseClient.auth.getSession();


  if(!session) {

    showLogin();

    return;

  }


  const {data,error} =
    await supabaseClient.rpc("is_admin");


  if(error || data !== true) {

    await supabaseClient.auth.signOut();

    showLogin();

    return;

  }


  showDashboard();

  await loadCards();

}



// =============================
// LOGIN
// =============================

async function login() {

  const email =
    emailInput.value.trim();

  const password =
    passwordInput.value;


  if(!email || !password) {

    loginStatus.textContent =
      "Isi email dan password.";

    loginStatus.className =
      "error";

    return;

  }


  loginBtn.disabled = true;

  loginBtn.textContent =
    "LOGIN...";


  const {error} =
    await supabaseClient.auth.signInWithPassword({
      email,
      password
    });


  if(error) {

    loginStatus.textContent =
      "Email atau password salah.";

    loginStatus.className =
      "error";

    loginBtn.disabled = false;

    loginBtn.textContent =
      "LOGIN ADMIN";

    return;

  }


  const admin =
    await supabaseClient.rpc(
      "is_admin"
    );


  if(
    admin.error ||
    admin.data !== true
  ) {

    await supabaseClient.auth.signOut();

    loginStatus.textContent =
      "Akun bukan admin Nexa.";

    loginStatus.className =
      "error";

    loginBtn.disabled = false;

    loginBtn.textContent =
      "LOGIN ADMIN";

    return;

  }


  passwordInput.value = "";

  loginBtn.disabled = false;

  loginBtn.textContent =
    "LOGIN ADMIN";


  showDashboard();

  await loadCards();

}



// =============================
// LOGOUT
// =============================

async function logout() {

  await supabaseClient.auth.signOut();

  cards = [];

  showLogin();

}



// =============================
// LOAD CARDS
// =============================

async function loadCards() {

  setStatus(
    "Mengambil data kartu..."
  );


  const {data,error} =
    await supabaseClient.rpc(
      "admin_list_cards"
    );


  if(error) {

    console.error(error);

    setStatus(
      "Gagal mengambil data kartu.",
      "error"
    );

    return;

  }


  cards =
    Array.isArray(data)
    ? data
    : [];


  updateStats();

  renderCards();


  setStatus(
    "Data kartu berhasil dimuat.",
    "success"
  );

}



// =============================
// STATS
// =============================

function updateStats() {

  const active =
    cards.filter(
      c => normalizeStatus(c.status) === "active"
    ).length;


  const inactive =
    cards.filter(
      c => normalizeStatus(c.status) === "inactive"
    ).length;


  totalCards.textContent =
    cards.length;

  activeCards.textContent =
    active;

  inactiveCards.textContent =
    inactive;

}



// =============================
// RENDER CARDS
// =============================

function renderCards() {

  const keyword =
    searchInput.value
    .trim()
    .toLowerCase();


  const filtered =
    cards.filter(card => {

      const code =
        String(card.card_code || "")
        .toLowerCase();

      const name =
        String(card.name || "")
        .toLowerCase();


      return (
        code.includes(keyword) ||
        name.includes(keyword)
      );

    });


  cardsContainer.innerHTML = "";


  if(filtered.length === 0) {

    cardsContainer.innerHTML =
      '<div class="empty">Tidak ada kartu.</div>';

    return;

  }


  filtered.forEach(card => {

    const status =
      normalizeStatus(card.status);


    const nfcWritten =
      card.nfc_written === true;

    const qcPassed =
      card.qc_passed === true;

    const nfcLocked =
      card.nfc_locked === true;


    const element =
      document.createElement("div");


    element.className =
      "card";


    element.innerHTML = `

      <div class="card-header">

        <div class="card-code">
          ${escapeHTML(card.card_code)}
        </div>

        <span class="badge ${status}">
          ${status.toUpperCase()}
        </span>

      </div>


      <div class="details">

        <div>
          Bisnis:
          <strong>
            ${escapeHTML(card.name || "-")}
          </strong>
        </div>

        <div>
          Dibuat:
          ${formatDate(card.created_at)}
        </div>

      </div>


      <div class="production">

        <div class="production-title">
          STATUS PRODUKSI
        </div>

        <div class="production-status">

          <span class="mini-status ${nfcWritten ? "done" : ""}">
            ${nfcWritten ? "✓" : "○"} NFC DITULIS
          </span>

          <span class="mini-status ${qcPassed ? "done" : ""}">
            ${qcPassed ? "✓" : "○"} QC LULUS
          </span>

          <span class="mini-status ${nfcLocked ? "done" : ""}">
            ${nfcLocked ? "✓" : "○"} LOCKED
          </span>

        </div>


        <div class="production-actions">

          <button
            class="${nfcWritten ? "success-btn" : "warning-btn"}"
            ${nfcWritten ? "disabled" : ""}
            onclick="markNfcWritten('${safeJS(card.card_code)}')"
          >
            ${nfcWritten ? "NFC SUDAH DITULIS" : "TANDAI NFC DITULIS"}
          </button>


          <button
            class="${qcPassed ? "success-btn" : "secondary"}"
            ${(!nfcWritten || qcPassed) ? "disabled" : ""}
            onclick="markQcPassed('${safeJS(card.card_code)}')"
          >
            ${qcPassed ? "QC SUDAH LULUS" : "TANDAI QC LULUS"}
          </button>


          <button
            class="${nfcLocked ? "success-btn" : "secondary"}"
            ${(!qcPassed || nfcLocked) ? "disabled" : ""}
            onclick="markNfcLocked('${safeJS(card.card_code)}')"
          >
            ${nfcLocked ? "NFC LOCKED" : "TANDAI LOCKED"}
          </button>

        </div>

      </div>


      <div class="actions">

        <button
          class="secondary"
          onclick="copyLink('${safeJS(card.card_code)}')"
        >
          COPY LINK
        </button>


        <button
          class="secondary"
          onclick="downloadSingleQR('${safeJS(card.card_code)}')"
        >
          QR
        </button>


        <button
          class="secondary"
          onclick="openManage('${safeJS(card.card_code)}')"
        >
          KELOLA
        </button>


        <button
          class="danger"
          onclick="resetCard('${safeJS(card.card_code)}')"
        >
          RESET
        </button>

      </div>

    `;


    cardsContainer.appendChild(
      element
    );

  });

}



// =============================
// MARK NFC WRITTEN
// =============================

async function markNfcWritten(code) {

  const yakin =
    confirm(
      `Apakah link NFC ${code} sudah benar-benar ditulis ke chip?`
    );


  if(!yakin) return;


  const {data,error} =
    await supabaseClient.rpc(
      "admin_mark_nfc_written",
      {
        p_card_code:code
      }
    );


  if(error || data !== true) {

    console.error(error);

    setStatus(
      "Gagal menandai NFC.",
      "error"
    );

    return;

  }


  setStatus(
    code + " ditandai NFC sudah ditulis.",
    "success"
  );


  await loadCards();

}



// =============================
// MARK QC
// =============================

async function markQcPassed(code) {

  const yakin =
    confirm(
      `Pastikan QR dan NFC ${code} sudah dites dan keduanya membuka kartu yang sama.\n\nTandai QC LULUS?`
    );


  if(!yakin) return;


  const {data,error} =
    await supabaseClient.rpc(
      "admin_mark_qc_passed",
      {
        p_card_code:code
      }
    );


  if(error || data !== true) {

    console.error(error);

    setStatus(
      "QC gagal ditandai. Pastikan NFC sudah ditulis.",
      "error"
    );

    return;

  }


  setStatus(
    code + " berhasil QC.",
    "success"
  );


  await loadCards();

}



// =============================
// MARK LOCKED
// =============================

async function markNfcLocked(code) {

  const yakin =
    confirm(
      `PERHATIAN:\n\nTombol ini hanya untuk mencatat bahwa NFC ${code} SUDAH kamu jadikan read-only lewat NFC Tools.\n\nApakah chip benar-benar sudah dikunci?`
    );


  if(!yakin) return;


  const {data,error} =
    await supabaseClient.rpc(
      "admin_mark_nfc_locked",
      {
        p_card_code:code
      }
    );


  if(error || data !== true) {

    console.error(error);

    setStatus(
      "Tidak bisa menandai LOCKED. Pastikan QC sudah lulus.",
      "error"
    );

    return;

  }


  setStatus(
    code + " ditandai LOCKED.",
    "success"
  );


  await loadCards();

}



// =============================
// CREATE ONE
// =============================

async function createCard() {

  const code =
    newCardCode.value
    .trim()
    .toUpperCase();


  if(!code) {

    setStatus(
      "Masukkan kode kartu.",
      "error"
    );

    return;

  }


  createBtn.disabled = true;


  const {data,error} =
    await supabaseClient.rpc(
      "admin_create_card",
      {
        p_card_code:code
      }
    );


  createBtn.disabled = false;


  if(error) {

    setStatus(
      error.message,
      "error"
    );

    return;

  }


  if(data !== true) {

    setStatus(
      "Kode kartu sudah ada.",
      "error"
    );

    return;

  }


  newCardCode.value = "";


  await loadCards();

}



// =============================
// CREATE BULK
// =============================

async function createBulk() {

  const start =
    parseInt(bulkStart.value);

  const count =
    parseInt(bulkCount.value);


  if(
    !Number.isInteger(start) ||
    start < 1
  ) {

    setStatus(
      "Nomor awal tidak valid.",
      "error"
    );

    return;

  }


  if(
    !Number.isInteger(count) ||
    count < 1 ||
    count > 500
  ) {

    setStatus(
      "Jumlah harus 1 sampai 500.",
      "error"
    );

    return;

  }


  bulkBtn.disabled = true;

  bulkBtn.textContent =
    "MEMBUAT...";


  const {data,error} =
    await supabaseClient.rpc(
      "admin_create_cards_bulk",
      {
        p_start:start,
        p_count:count
      }
    );


  bulkBtn.disabled = false;

  bulkBtn.textContent =
    "BUAT BANYAK";


  if(error) {

    console.error(error);

    setStatus(
      error.message,
      "error"
    );

    return;

  }


  const totalCreated =
    Array.isArray(data)
    ? data.length
    : 0;


  setStatus(
    totalCreated +
    " kartu berhasil dibuat.",
    "success"
  );


  bulkStart.value = "";
  bulkCount.value = "";


  await loadCards();

}



// =============================
// RESET CARD
// =============================

async function resetCard(code) {

  const yakin =
    confirm(
      `Reset ${code}?\n\nNama bisnis, Google Review dan PIN akan dihapus.\n\nStatus produksi NFC tidak dihapus.`
    );


  if(!yakin) return;


  const {data,error} =
    await supabaseClient.rpc(
      "admin_reset_card",
      {
        p_card_code:code
      }
    );


  if(error || data !== true) {

    setStatus(
      "Reset gagal.",
      "error"
    );

    return;

  }


  setStatus(
    code + " berhasil direset.",
    "success"
  );


  await loadCards();

}



// =============================
// CARD URL
// =============================

function getCardURL(code) {

  const base =
    window.location.pathname
    .replace("admin.html","");


  return (
    window.location.origin +
    base +
    "?card=" +
    encodeURIComponent(code)
  );

}



// =============================
// COPY LINK
// =============================

async function copyLink(code) {

  const url =
    getCardURL(code);


  try {

    await navigator.clipboard.writeText(
      url
    );


    setStatus(
      "Link " + code +
      " berhasil disalin.",
      "success"
    );

  }
  catch {

    prompt(
      "Copy link:",
      url
    );

  }

}



// =============================
// MANAGE
// =============================

function openManage(code) {

  const base =
    window.location.pathname
    .replace("admin.html","");


  window.open(

    window.location.origin +
    base +
    "manage.html?card=" +
    encodeURIComponent(code),

    "_blank"

  );

}



// =============================
// QR GENERATOR
// =============================

function generateQRData(code) {

  return new Promise(resolve => {

    qrHidden.innerHTML = "";


    new QRCode(qrHidden, {

      text:getCardURL(code),

      width:1000,

      height:1000,

      correctLevel:
        QRCode.CorrectLevel.H

    });


    setTimeout(() => {

      const canvas =
        qrHidden.querySelector("canvas");


      if(canvas) {

        resolve(
          canvas.toDataURL("image/png")
        );

        return;

      }


      const img =
        qrHidden.querySelector("img");


      resolve(
        img ? img.src : null
      );


    },150);

  });

}



// =============================
// QR SINGLE
// =============================

async function downloadSingleQR(code) {

  setStatus(
    "Membuat QR " + code + "..."
  );


  const dataUrl =
    await generateQRData(code);


  if(!dataUrl) {

    setStatus(
      "Gagal membuat QR.",
      "error"
    );

    return;

  }


  const a =
    document.createElement("a");

  a.href =
    dataUrl;

  a.download =
    code + ".png";

  a.click();


  setStatus(
    "QR " + code +
    " berhasil dibuat.",
    "success"
  );

}



// =============================
// ZIP QR
// =============================

async function downloadInactiveQR() {

  const inactive =
    cards.filter(
      card =>
      normalizeStatus(card.status) ===
      "inactive"
    );


  if(inactive.length === 0) {

    setStatus(
      "Tidak ada kartu inactive.",
      "error"
    );

    return;

  }


  const yakin =
    confirm(
      `Generate ${inactive.length} QR kartu inactive?`
    );


  if(!yakin) return;


  downloadQrBtn.disabled = true;

  downloadQrBtn.textContent =
    "MEMBUAT ZIP...";


  try {

    const zip =
      new JSZip();

    const folder =
      zip.folder("NEXA_QR");


    let csv =
      "card_code,url\n";


    for(
      let i=0;
      i<inactive.length;
      i++
    ) {

      const code =
        inactive[i].card_code;

      const url =
        getCardURL(code);


      setStatus(
        `Membuat QR ${i+1}/${inactive.length}: ${code}`
      );


      const dataUrl =
        await generateQRData(code);


      if(dataUrl) {

        folder.file(
          code + ".png",
          dataUrl.split(",")[1],
          {base64:true}
        );

      }


      csv +=
        `"${code}","${url}"\n`;

    }


    zip.file(
      "manifest.csv",
      csv
    );


    const blob =
      await zip.generateAsync({
        type:"blob"
      });


    const link =
      document.createElement("a");


    const blobUrl =
      URL.createObjectURL(blob);


    link.href =
      blobUrl;

    link.download =
      "NEXA_QR_INACTIVE.zip";

    link.click();


    setTimeout(() => {
      URL.revokeObjectURL(blobUrl);
    },1000);


    setStatus(
      inactive.length +
      " QR berhasil dibuat.",
      "success"
    );


  }
  catch(error) {

    console.error(error);

    setStatus(
      "Gagal membuat ZIP QR.",
      "error"
    );

  }


  downloadQrBtn.disabled = false;

  downloadQrBtn.textContent =
    "DOWNLOAD ZIP QR INACTIVE";

}



// =============================
// HELPERS
// =============================

function normalizeStatus(value) {

  return String(value || "")
    .trim()
    .toLowerCase();

}


function escapeHTML(value) {

  return String(value)

    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function safeJS(value) {

  return String(value)

    .replaceAll("\\","\\\\")

    .replaceAll("'","\\'");

}


function formatDate(value) {

  if(!value) return "-";


  const d =
    new Date(value);


  if(Number.isNaN(d.getTime())) {

    return "-";

  }


  return d.toLocaleString(
    "id-ID"
  );

}
