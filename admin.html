<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NEXA Admin</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #070707;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .container {
      width: 92%;
      max-width: 1100px;
      margin: auto;
      padding: 35px 0;
    }

    h1 {
      margin: 0;
      font-size: 32px;
    }

    .subtitle {
      color: #777;
      margin-top: 7px;
    }

    .box {
      background: #101010;
      border: 1px solid #242424;
      border-radius: 16px;
      padding: 20px;
      margin-top: 20px;
    }

    label {
      display: block;
      color: #aaa;
      font-size: 14px;
      margin-bottom: 7px;
      margin-top: 15px;
    }

    input {
      width: 100%;
      padding: 14px;
      background: #151515;
      color: white;
      border: 1px solid #333;
      border-radius: 10px;
      outline: none;
      font-size: 15px;
    }

    input:focus {
      border-color: #fff;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 12px 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .primary {
      background: #fff;
      color: #000;
    }

    .secondary {
      background: #202020;
      color: #fff;
      border: 1px solid #333;
    }

    .danger {
      background: #261111;
      color: #ff7777;
      border: 1px solid #512222;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    #loginPage {
      max-width: 420px;
      margin: 70px auto;
    }

    #dashboard {
      display: none;
    }

    #loginBtn {
      width: 100%;
      margin-top: 20px;
      padding: 15px;
    }

    #status {
      min-height: 22px;
      margin-top: 15px;
      color: #aaa;
    }

    .error {
      color: #ff5555 !important;
    }

    .success {
      color: #00e887 !important;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      align-items: center;
      flex-wrap: wrap;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-top: 25px;
    }

    .stat {
      background: #101010;
      border: 1px solid #242424;
      border-radius: 14px;
      padding: 20px;
    }

    .stat-title {
      color: #777;
      font-size: 13px;
    }

    .stat-value {
      margin-top: 8px;
      font-size: 28px;
      font-weight: bold;
    }

    .toolbar {
      display: flex;
      gap: 10px;
      margin-top: 25px;
      flex-wrap: wrap;
    }

    .toolbar input {
      flex: 1;
      min-width: 220px;
    }

    .create-area {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    .create-area input {
      flex: 1;
    }

    .cards {
      margin-top: 20px;
      display: grid;
      gap: 12px;
    }

    .card {
      background: #101010;
      border: 1px solid #242424;
      border-radius: 14px;
      padding: 18px;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      align-items: center;
      flex-wrap: wrap;
    }

    .card-code {
      font-size: 18px;
      font-weight: bold;
    }

    .badge {
      padding: 6px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
    }

    .active {
      background: #0e2c20;
      color: #00e887;
    }

    .inactive {
      background: #302711;
      color: #ffc857;
    }

    .details {
      margin-top: 13px;
      color: #888;
      line-height: 1.7;
      word-break: break-word;
    }

    .actions {
      margin-top: 15px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .empty {
      color: #777;
      text-align: center;
      padding: 35px;
    }

    @media (max-width: 650px) {
      .stats {
        grid-template-columns: 1fr;
      }

      .create-area {
        flex-direction: column;
      }

      .actions button {
        flex: 1;
      }
    }
  </style>
</head>

<body>

<!-- LOGIN -->

<div id="loginPage" class="container">

  <h1>NEXA</h1>
  <p class="subtitle">Admin Dashboard</p>

  <div class="box">

    <label>Email Admin</label>
    <input
      type="email"
      id="email"
      placeholder="Email admin"
    >

    <label>Password</label>
    <input
      type="password"
      id="password"
      placeholder="Password admin"
    >

    <button
      id="loginBtn"
      class="primary"
    >
      LOGIN ADMIN
    </button>

    <p id="loginStatus"></p>

  </div>

</div>


<!-- DASHBOARD -->

<div id="dashboard">

  <div class="container">

    <div class="topbar">

      <div>
        <h1>NEXA Admin</h1>
        <p class="subtitle">
          Manajemen Kartu Google Review
        </p>
      </div>

      <button
        id="logoutBtn"
        class="secondary"
      >
        LOGOUT
      </button>

    </div>


    <div class="stats">

      <div class="stat">
        <div class="stat-title">
          TOTAL KARTU
        </div>
        <div
          class="stat-value"
          id="totalCards"
        >
          0
        </div>
      </div>

      <div class="stat">
        <div class="stat-title">
          ACTIVE
        </div>
        <div
          class="stat-value"
          id="activeCards"
        >
          0
        </div>
      </div>

      <div class="stat">
        <div class="stat-title">
          INACTIVE
        </div>
        <div
          class="stat-value"
          id="inactiveCards"
        >
          0
        </div>
      </div>

    </div>


    <div class="box">

      <strong>Tambah Kartu Baru</strong>

      <div class="create-area">

        <input
          type="text"
          id="newCardCode"
          placeholder="Contoh: CARD002"
        >

        <button
          id="createBtn"
          class="primary"
        >
          TAMBAH KARTU
        </button>

      </div>

      <p id="status"></p>

    </div>


    <div class="toolbar">

      <input
        type="text"
        id="searchInput"
        placeholder="Cari CARD001 atau nama bisnis..."
      >

      <button
        id="refreshBtn"
        class="secondary"
      >
        REFRESH
      </button>

    </div>


    <div
      id="cardsContainer"
      class="cards"
    ></div>

  </div>

</div>


<script>

const SUPABASE_URL =
  "https://ksalsojmvyqwhbcggejy.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_BAk8-o_novmk_D73RnX26Q_cju3IBO6";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


const loginPage =
  document.getElementById("loginPage");

const dashboard =
  document.getElementById("dashboard");

const emailInput =
  document.getElementById("email");

const passwordInput =
  document.getElementById("password");

const loginBtn =
  document.getElementById("loginBtn");

const loginStatus =
  document.getElementById("loginStatus");

const logoutBtn =
  document.getElementById("logoutBtn");

const totalCards =
  document.getElementById("totalCards");

const activeCards =
  document.getElementById("activeCards");

const inactiveCards =
  document.getElementById("inactiveCards");

const cardsContainer =
  document.getElementById("cardsContainer");

const searchInput =
  document.getElementById("searchInput");

const refreshBtn =
  document.getElementById("refreshBtn");

const newCardCode =
  document.getElementById("newCardCode");

const createBtn =
  document.getElementById("createBtn");

const statusEl =
  document.getElementById("status");


let cards = [];



function setStatus(text, type = "") {

  statusEl.textContent =
    text;

  statusEl.className =
    type;

}



function showLogin() {

  loginPage.style.display =
    "block";

  dashboard.style.display =
    "none";

}



function showDashboard() {

  loginPage.style.display =
    "none";

  dashboard.style.display =
    "block";

}



// ==================================
// CEK SESSION
// ==================================

async function checkSession() {

  const {
    data: { session }
  } =
    await supabaseClient.auth.getSession();


  if (!session) {

    showLogin();

    return;
  }


  const {
    data,
    error
  } =
    await supabaseClient.rpc(
      "is_admin"
    );


  if (
    error ||
    data !== true
  ) {

    await supabaseClient.auth.signOut();

    showLogin();

    return;
  }


  showDashboard();

  await loadCards();

}



// ==================================
// LOGIN
// ==================================

async function login() {

  const email =
    emailInput.value.trim();

  const password =
    passwordInput.value;


  if (!email || !password) {

    loginStatus.textContent =
      "Isi email dan password.";

    loginStatus.className =
      "error";

    return;
  }


  loginBtn.disabled =
    true;

  loginBtn.textContent =
    "LOGIN...";

  loginStatus.textContent =
    "Memeriksa akun...";

  loginStatus.className =
    "";


  const {
    data,
    error
  } =
    await supabaseClient.auth.signInWithPassword({

      email: email,

      password: password

    });


  if (error) {

    loginStatus.textContent =
      "Email atau password salah.";

    loginStatus.className =
      "error";

    loginBtn.disabled =
      false;

    loginBtn.textContent =
      "LOGIN ADMIN";

    return;
  }


  const adminCheck =
    await supabaseClient.rpc(
      "is_admin"
    );


  if (
    adminCheck.error ||
    adminCheck.data !== true
  ) {

    await supabaseClient.auth.signOut();

    loginStatus.textContent =
      "Akun ini bukan admin Nexa.";

    loginStatus.className =
      "error";

    loginBtn.disabled =
      false;

    loginBtn.textContent =
      "LOGIN ADMIN";

    return;
  }


  passwordInput.value = "";

  showDashboard();

  loginBtn.disabled =
    false;

  loginBtn.textContent =
    "LOGIN ADMIN";


  await loadCards();

}



// ==================================
// LOGOUT
// ==================================

async function logout() {

  await supabaseClient.auth.signOut();

  cards = [];

  cardsContainer.innerHTML = "";

  showLogin();

}



// ==================================
// LOAD SEMUA KARTU
// ==================================

async function loadCards() {

  setStatus(
    "Mengambil data kartu..."
  );


  const {
    data,
    error
  } =
    await supabaseClient.rpc(
      "admin_list_cards"
    );


  if (error) {

    console.error(error);

    setStatus(
      "Gagal mengambil data kartu.",
      "error"
    );

    return;
  }


  cards =
    Array.isArray(data)
    ? data
    : [];


  updateStats();

  renderCards();

  setStatus(
    "Data kartu berhasil dimuat.",
    "success"
  );

}



// ==================================
// STATISTIK
// ==================================

function updateStats() {

  const active =
    cards.filter(card =>
      String(card.status)
      .trim()
      .toLowerCase() === "active"
    ).length;


  const inactive =
    cards.filter(card =>
      String(card.status)
      .trim()
      .toLowerCase() === "inactive"
    ).length;


  totalCards.textContent =
    cards.length;

  activeCards.textContent =
    active;

  inactiveCards.textContent =
    inactive;

}



// ==================================
// TAMPILKAN KARTU
// ==================================

function renderCards() {

  const keyword =
    searchInput.value
    .trim()
    .toLowerCase();


  const filtered =
    cards.filter(card => {

      const code =
        String(
          card.card_code || ""
        ).toLowerCase();

      const name =
        String(
          card.name || ""
        ).toLowerCase();


      return (
        code.includes(keyword) ||
        name.includes(keyword)
      );

    });


  cardsContainer.innerHTML = "";


  if (filtered.length === 0) {

    cardsContainer.innerHTML =
      `<div class="empty">
        Tidak ada kartu.
      </div>`;

    return;
  }


  filtered.forEach(card => {

    const status =
      String(card.status || "")
      .trim()
      .toLowerCase();


    const element =
      document.createElement("div");


    element.className =
      "card";


    element.innerHTML = `

      <div class="card-header">

        <div class="card-code">
          ${escapeHTML(card.card_code)}
        </div>

        <span class="badge ${status}">
          ${status.toUpperCase()}
        </span>

      </div>


      <div class="details">

        <div>
          Bisnis:
          <strong>
            ${escapeHTML(card.name || "-")}
          </strong>
        </div>

        <div>
          Dibuat:
          ${formatDate(card.created_at)}
        </div>

      </div>


      <div class="actions">

        <button
          class="secondary"
          onclick="copyActivationLink('${safeJS(card.card_code)}')"
        >
          COPY LINK KARTU
        </button>


        <button
          class="secondary"
          onclick="openManage('${safeJS(card.card_code)}')"
        >
          KELOLA
        </button>


        <button
          class="danger"
          onclick="resetCard('${safeJS(card.card_code)}')"
        >
          RESET
        </button>

      </div>

    `;


    cardsContainer.appendChild(
      element
    );

  });

}



// ==================================
// BUAT KARTU
// ==================================

async function createCard() {

  const code =
    newCardCode.value
    .trim()
    .toUpperCase();


  if (!code) {

    setStatus(
      "Masukkan kode kartu.",
      "error"
    );

    return;
  }


  createBtn.disabled =
    true;

  createBtn.textContent =
    "MEMBUAT...";


  const {
    data,
    error
  } =
    await supabaseClient.rpc(
      "admin_create_card",
      {
        p_card_code: code
      }
    );


  createBtn.disabled =
    false;

  createBtn.textContent =
    "TAMBAH KARTU";


  if (error) {

    console.error(error);

    setStatus(
      error.message ||
      "Gagal membuat kartu.",
      "error"
    );

    return;
  }


  if (data !== true) {

    setStatus(
      "Kode kartu sudah digunakan.",
      "error"
    );

    return;
  }


  newCardCode.value = "";


  setStatus(
    `${code} berhasil dibuat.`,
    "success"
  );


  await loadCards();

}



// ==================================
// RESET KARTU
// ==================================

async function resetCard(code) {

  const yakin =
    confirm(
      `Reset ${code}?\n\n` +
      `Nama bisnis, link Google Review dan PIN akan dihapus.`
    );


  if (!yakin) {
    return;
  }


  setStatus(
    `Mereset ${code}...`
  );


  const {
    data,
    error
  } =
    await supabaseClient.rpc(
      "admin_reset_card",
      {
        p_card_code: code
      }
    );


  if (error) {

    console.error(error);

    setStatus(
      "Reset kartu gagal.",
      "error"
    );

    return;
  }


  if (data !== true) {

    setStatus(
      "Kartu tidak ditemukan.",
      "error"
    );

    return;
  }


  setStatus(
    `${code} berhasil direset.`,
    "success"
  );


  await loadCards();

}



// ==================================
// COPY LINK KARTU
// ==================================

async function copyActivationLink(code) {

  const url =
    `${window.location.origin}` +
    `${window.location.pathname.replace("admin.html", "")}` +
    `?card=${encodeURIComponent(code)}`;


  try {

    await navigator.clipboard.writeText(
      url
    );

    setStatus(
      `Link ${code} berhasil disalin.`,
      "success"
    );

  } catch {

    prompt(
      "Copy link ini:",
      url
    );

  }

}



// ==================================
// BUKA MANAGE
// ==================================

function openManage(code) {

  const base =
    window.location.pathname
    .replace(
      "admin.html",
      ""
    );


  window.open(
    `${window.location.origin}${base}manage.html?card=${encodeURIComponent(code)}`,
    "_blank"
  );

}



// ==================================
// HELPERS
// ==================================

function escapeHTML(value) {

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


function safeJS(value) {

  return String(value)
    .replaceAll("\\", "\\\\")
    .replaceAll("'", "\\'");

}


function formatDate(value) {

  if (!value) {
    return "-";
  }


  const date =
    new Date(value);


  if (
    Number.isNaN(
      date.getTime()
    )
  ) {

    return "-";

  }


  return date.toLocaleString(
    "id-ID"
  );

}



// ==================================
// EVENTS
// ==================================

loginBtn.addEventListener(
  "click",
  login
);


logoutBtn.addEventListener(
  "click",
  logout
);


refreshBtn.addEventListener(
  "click",
  loadCards
);


createBtn.addEventListener(
  "click",
  createCard
);


searchInput.addEventListener(
  "input",
  renderCards
);


passwordInput.addEventListener(
  "keydown",
  event => {

    if (event.key === "Enter") {
      login();
    }

  }
);


checkSession();

</script>

</body>
</html>
