<!DOCTYPE html>
<html lang="id">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

    .subtitle {

      margin-bottom: 30px;

    #status {

    }

    #formAktivasi {

    }

      margin-top: 15px;
      margin-bottom: 7px;
      color: #bbb;
      font-size: 14px;
    }

      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #333;
      background: #111;
      color: white;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #fff;
    }

    button {
      width: 100%;
      margin-top: 25px;

      border: none;

      color: black;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
    }

    .success {
      color: #00ff88 !important;
    }

    .error {
      color: #ff5555 !important;
    }
  </style>
</head>
