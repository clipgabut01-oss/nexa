<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aktivasi Kartu NEXA</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#050505;
  color:#fff;
  font-family:Arial,sans-serif;
}
.container{
  width:90%;
  max-width:430px;
  padding:35px 20px;
}
h1{
  text-align:center;
  margin:0;
  font-size:34px;
}
.subtitle{
  text-align:center;
  color:#888;
  margin:8px 0 25px;
}
.card-info{
  background:#111;
  border:1px solid #222;
  border-radius:12px;
  padding:13px;
  text-align:center;
  color:#aaa;
  margin-bottom:20px;
}
#status{
  text-align:center;
  color:#bbb;
  min-height:22px;
  margin-bottom:20px;
  line-height:1.5;
}
.form{
  display:none;
}
label{
  display:block;
  margin:15px 0 7px;
  color:#bbb;
  font-size:14px;
}
input{
  width:100%;
  padding:14px;
  border:1px solid #333;
  border-radius:10px;
  background:#111;
  color:#fff;
  font-size:16px;
  outline:none;
}
input:focus{border-color:#fff}
button{
  width:100%;
  padding:15px;
  margin-top:20px;
  border:0;
  border-radius:10px;
  background:#fff;
  color:#000;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}
button:disabled{
  opacity:.5;
  cursor:not-allowed;
}
.success{color:#00e887!important}
.error{color:#ff5555!important}
.note{
  margin-top:15px;
  color:#666;
  font-size:12px;
  line-height:1.5;
  text-align:center;
}
</style>
</head>
<body>

<div class="container">
  <h1>NEXA</h1>
  <p class="subtitle">Aktivasi Kartu Google Review</p>

  <div class="card-info">
    Kode kartu:
    <strong id="cardCodeText">-</strong>
  </div>

  <p id="status">Memeriksa kartu...</p>

  <div id="activationForm" class="form">
    <label>Nama Bisnis</label>
    <input
      id="businessName"
      type="text"
      placeholder="Contoh: Kopi NEXA"
      autocomplete="organization"
    >

    <label>Link Google Review</label>
    <input
      id="reviewUrl"
      type="url"
      placeholder="https://..."
      autocomplete="url"
    >

    <label>Buat PIN 6 Digit</label>
    <input
      id="pinInput"
      type="password"
      inputmode="numeric"
      maxlength="6"
      placeholder="Contoh: 123456"
      autocomplete="new-password"
    >

    <label>Konfirmasi PIN</label>
    <input
      id="confirmPinInput"
      type="password"
      inputmode="numeric"
      maxlength="6"
      placeholder="Ulangi PIN"
      autocomplete="new-password"
    >

    <button id="activateBtn">AKTIFKAN KARTU</button>

    <p class="note">
      Simpan PIN ini. PIN digunakan untuk mengubah pengaturan kartu setelah kartu aktif.
    </p>
  </div>
</div>

<script>
const SUPABASE_URL =
  "https://ksalsojmvyqwhbcggejy.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_BAk8-o_novmk_D73RnX26Q_cju3IBO6";

const params =
  new URLSearchParams(window.location.search);

const cardCode =
  (params.get("card") || "").trim();

const activationToken =
  (params.get("token") || "").trim();

const cardCodeText =
  document.getElementById("cardCodeText");

const statusEl =
  document.getElementById("status");

const activationForm =
  document.getElementById("activationForm");

const businessName =
  document.getElementById("businessName");

const reviewUrl =
  document.getElementById("reviewUrl");

const pinInput =
  document.getElementById("pinInput");

const confirmPinInput =
  document.getElementById("confirmPinInput");

const activateBtn =
  document.getElementById("activateBtn");


function setStatus(text, type = "") {
  statusEl.textContent = text;
  statusEl.className = type;
}


function validUuid(value) {
  return /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(value);
}


async function checkCard() {
  if (!cardCode) {
    cardCodeText.textContent = "-";
    setStatus(
      "Kode kartu tidak ditemukan.",
      "error"
    );
    return;
  }

  cardCodeText.textContent = cardCode;

  if (!activationToken || !validUuid(activationToken)) {
    setStatus(
      "Link aktivasi tidak valid. Gunakan QR atau NFC asli kartu NEXA.",
      "error"
    );
    return;
  }

  try {
    const response =
      await fetch(
        `${SUPABASE_URL}/rest/v1/cards` +
        `?card_code=eq.${encodeURIComponent(cardCode)}` +
        `&select=card_code,status,target_url`,
        {
          headers: {
            "apikey": SUPABASE_KEY
          }
        }
      );

    const data =
      await response.json();

    if (!response.ok) {
      setStatus(
        "Gagal memeriksa kartu.",
        "error"
      );
      return;
    }

    if (
      !Array.isArray(data) ||
      data.length === 0
    ) {
      setStatus(
        "Kartu tidak ditemukan.",
        "error"
      );
      return;
    }

    const card =
      data[0];

    const status =
      String(card.status || "")
      .trim()
      .toLowerCase();

    if (
      status === "active" &&
      card.target_url
    ) {
      setStatus(
        "Kartu aktif. Mengarahkan ke Google Review...",
        "success"
      );

      window.location.replace(
        card.target_url
      );

      return;
    }

    if (status !== "inactive") {
      setStatus(
        "Status kartu tidak valid.",
        "error"
      );
      return;
    }

    setStatus(
      "Kartu ditemukan. Lengkapi aktivasi.",
      "success"
    );

    activationForm.style.display =
      "block";

  } catch (error) {
    console.error(error);

    setStatus(
      "Terjadi kesalahan koneksi.",
      "error"
    );
  }
}


async function activateCard() {
  const name =
    businessName.value.trim();

  const url =
    reviewUrl.value.trim();

  const pin =
    pinInput.value.trim();

  const confirmPin =
    confirmPinInput.value.trim();

  if (!name) {
    setStatus(
      "Nama bisnis wajib diisi.",
      "error"
    );
    return;
  }

  if (
    !url ||
    !url.startsWith("https://")
  ) {
    setStatus(
      "Link Google Review tidak valid.",
      "error"
    );
    return;
  }

  if (!/^\d{6}$/.test(pin)) {
    setStatus(
      "PIN harus 6 digit angka.",
      "error"
    );
    return;
  }

  if (pin !== confirmPin) {
    setStatus(
      "Konfirmasi PIN tidak sama.",
      "error"
    );
    return;
  }

  if (
    !activationToken ||
    !validUuid(activationToken)
  ) {
    setStatus(
      "Token aktivasi tidak valid.",
      "error"
    );
    return;
  }

  activateBtn.disabled = true;
  activateBtn.textContent =
    "MENGAKTIFKAN...";

  setStatus(
    "Mengaktifkan kartu..."
  );

  try {
    const response =
      await fetch(
        `${SUPABASE_URL}/rest/v1/rpc/activate_card`,
        {
          method: "POST",
          headers: {
            "apikey": SUPABASE_KEY,
            "Content-Type":
              "application/json"
          },
          body: JSON.stringify({
            p_card_code:
              cardCode,
            p_name:
              name,
            p_target_url:
              url,
            p_pin:
              pin,
            p_activation_token:
              activationToken
          })
        }
      );

    const result =
      await response.json();

    if (!response.ok) {
      console.error(result);

      setStatus(
        "Aktivasi gagal.",
        "error"
      );

      resetButton();
      return;
    }

    if (result !== true) {
      setStatus(
        "Aktivasi ditolak. Token salah, kartu sudah aktif, atau data tidak valid.",
        "error"
      );

      resetButton();
      return;
    }

    activationForm.style.display =
      "none";

    setStatus(
      "Kartu berhasil diaktifkan. Mengarahkan ke Google Review...",
      "success"
    );

    setTimeout(() => {
      window.location.replace(url);
    }, 900);

  } catch (error) {
    console.error(error);

    setStatus(
      "Terjadi kesalahan saat aktivasi.",
      "error"
    );

    resetButton();
  }
}


function resetButton() {
  activateBtn.disabled = false;
  activateBtn.textContent =
    "AKTIFKAN KARTU";
}


activateBtn.addEventListener(
  "click",
  activateCard
);

confirmPinInput.addEventListener(
  "keydown",
  event => {
    if (event.key === "Enter") {
      activateCard();
    }
  }
);

checkCard();
</script>

</body>
</html>
