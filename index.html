<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aktivasi Kartu</title>
</head>

<body>

  <h1>Aktivasi Kartu</h1>
  <p id="status">Memeriksa kartu...</p>

  <script>
    const SUPABASE_URL = "https://ksalsojmvyqwhbcggejy.supabase.co/rest/v1/";
    const SUPABASE_KEY = "sb_publishable_BAk8-o_novmk_D73RnX26Q_cju3IBO6";

    const params = new URLSearchParams(window.location.search);
    const cardCode = params.get("card");

    async function cekKartu() {
      if (!cardCode) {
        document.getElementById("status").textContent =
          "Kode kartu tidak ditemukan.";
        return;
      }

      const response = await fetch(
        `${SUPABASE_URL}/rest/v1/cards?card_code=eq.${encodeURIComponent(cardCode)}&select=*`,
        {
          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization": `Bearer ${SUPABASE_KEY}`
          }
        }
      );

      const data = await response.json();

      if (!response.ok) {
        document.getElementById("status").textContent =
          "Terjadi kesalahan saat menghubungkan ke database.";
        console.log(data);
        return;
      }

      if (data.length === 0) {
        document.getElementById("status").textContent =
          "Kartu tidak ditemukan.";
        return;
      }

      const kartu = data[0];

      if (kartu.status === "active" && kartu.target_url) {
        window.location.href = kartu.target_url;
        return;
      }

      document.getElementById("status").textContent =
        "Kartu ditemukan. Status: " + kartu.status;
    }

    cekKartu();
  </script>

</body>
</html>
