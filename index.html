<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Aktivasi Nexa</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #050505;
      color: white;
      font-family: Arial, sans-serif;
    }

    .container {
      width: 90%;
      max-width: 420px;
      padding: 30px 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #999;
      margin-bottom: 30px;
    }

    #status {
      text-align: center;
      margin-bottom: 20px;
      color: #ccc;
    }

    #formAktivasi {
      display: none;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 7px;
      font-size: 14px;
      color: #bbb;
    }

    input {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #333;
      background: #111;
      color: white;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: white;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: white;
      color: black;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
    }

    .success {
      color: #00ff88 !important;
    }

    .error {
      color: #ff5555 !important;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>NEXA</h1>

    <p class="subtitle">
      Aktivasi Kartu Google Review
    </p>

    <p id="status">
      Memeriksa kartu...
    </p>


    <div id="formAktivasi">

      <label>Nama Bisnis</label>

      <input
        type="text"
        id="businessName"
        placeholder="Contoh: Yamaha Tumenggung Suryo"
      >


      <label>Link Google Review</label>

      <input
        type="url"
        id="reviewUrl"
        placeholder="https://search.google.com/local/writereview?placeid=..."
      >


      <button id="activateBtn">
        AKTIVASI KARTU
      </button>

    </div>

  </div>


<script>

const SUPABASE_URL =
  "https://ksalsojmvyqwhbcggejy.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_BAk8-o_novmk_D73RnX26Q_cju3IBO6";


const params =
  new URLSearchParams(window.location.search);

const cardCode =
  params.get("card");


const statusElement =
  document.getElementById("status");

const formAktivasi =
  document.getElementById("formAktivasi");

const businessName =
  document.getElementById("businessName");

const reviewUrl =
  document.getElementById("reviewUrl");

const activateBtn =
  document.getElementById("activateBtn");


async function cekKartu() {

  if (!cardCode) {

    statusElement.textContent =
      "Kode kartu tidak ditemukan.";

    statusElement.classList.add("error");

    return;
  }


  try {

    const response = await fetch(

      `${SUPABASE_URL}/rest/v1/cards?card_code=eq.${encodeURIComponent(cardCode)}&select=*`,

      {
        headers: {

          "apikey": SUPABASE_KEY,

          "Authorization":
            `Bearer ${SUPABASE_KEY}`

        }
      }
    );


    const data =
      await response.json();


    if (!response.ok) {

      statusElement.textContent =
        "Gagal menghubungkan ke database.";

      statusElement.classList.add("error");

      return;
    }


    if (data.length === 0) {

      statusElement.textContent =
        "Kartu tidak ditemukan.";

      statusElement.classList.add("error");

      return;
    }


    const kartu = data[0];


    // SUDAH AKTIF
    if (
      kartu.status === "active" &&
      kartu.target_url
    ) {

      statusElement.textContent =
        "Membuka halaman ulasan...";

      window.location.href =
        kartu.target_url;

      return;
    }


    // BELUM AKTIF
    if (kartu.status === "inactive") {

      statusElement.textContent =
        "Kartu siap diaktifkan.";

      formAktivasi.style.display =
        "block";

      return;
    }


    statusElement.textContent =
      "Status kartu: " + kartu.status;


  } catch (error) {

    console.error(error);

    statusElement.textContent =
      "Terjadi kesalahan koneksi.";

    statusElement.classList.add("error");

  }

}



async function aktivasiKartu() {

  const nama =
    businessName.value.trim();

  const link =
    reviewUrl.value.trim();


  if (!nama) {

    statusElement.textContent =
      "Masukkan nama bisnis.";

    statusElement.className =
      "error";

    return;
  }


  if (!link) {

    statusElement.textContent =
      "Masukkan link Google Review.";

    statusElement.className =
      "error";

    return;
  }


  if (
    !link.startsWith("https://")
  ) {

    statusElement.textContent =
      "Link Google Review tidak valid.";

    statusElement.className =
      "error";

    return;
  }


  activateBtn.disabled = true;

  activateBtn.textContent =
    "MENGAKTIFKAN...";

  statusElement.textContent =
    "Sedang mengaktifkan kartu...";

  statusElement.className = "";


  try {

    const response = await fetch(

      `${SUPABASE_URL}/rest/v1/cards?card_code=eq.${encodeURIComponent(cardCode)}&status=eq.inactive`,

      {

        method: "PATCH",

        headers: {

          "apikey": SUPABASE_KEY,

          "Authorization":
            `Bearer ${SUPABASE_KEY}`,

          "Content-Type":
            "application/json",

          "Prefer":
            "return=representation"

        },


        body: JSON.stringify({

          name: nama,

          target_url: link,

          status: "active"

        })

      }

    );


    const data =
      await response.json();


    if (!response.ok) {

      console.error(data);

      statusElement.textContent =
        "Aktivasi gagal.";

      statusElement.className =
        "error";

      activateBtn.disabled = false;

      activateBtn.textContent =
        "AKTIVASI KARTU";

      return;
    }


    if (data.length === 0) {

      statusElement.textContent =
        "Kartu tidak dapat diaktifkan.";

      statusElement.className =
        "error";

      return;
    }


    statusElement.textContent =
      "Kartu berhasil diaktifkan!";

    statusElement.className =
      "success";

    formAktivasi.style.display =
      "none";


    setTimeout(() => {

      window.location.href =
        link;

    }, 1200);


  } catch (error) {

    console.error(error);

    statusElement.textContent =
      "Terjadi kesalahan saat aktivasi.";

    statusElement.className =
      "error";

    activateBtn.disabled = false;

    activateBtn.textContent =
      "AKTIVASI KARTU";

  }

}


activateBtn.addEventListener(
  "click",
  aktivasiKartu
);


cekKartu();

</script>

</body>
  </html>
