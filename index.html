<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Aktivasi Kartu</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #050505;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .container {
      width: 90%;
      max-width: 420px;
      padding: 30px;
      box-sizing: border-box;
    }

    h1 {
      margin-bottom: 20px;
    }

    #status {
      margin-bottom: 25px;
      color: #ccc;
    }

    #activateBtn {
      display: none;
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #ffffff;
      color: #000000;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #activateBtn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .success {
      color: #00ff88 !important;
    }

    .error {
      color: #ff4444 !important;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Aktivasi Kartu</h1>

    <p id="status">Memeriksa kartu...</p>

    <button id="activateBtn">
      AKTIVASI KARTU
    </button>

  </div>

  <script>

    const SUPABASE_URL =
      "https://ksalsojmvyqwhbcggejy.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_BAk8-o_novmk_D73RnX26Q_cju3IBO6";

    const params = new URLSearchParams(window.location.search);

    const cardCode = params.get("card");

    const statusElement =
      document.getElementById("status");

    const activateButton =
      document.getElementById("activateBtn");

    let kartu = null;


    // =========================
    // CEK KARTU
    // =========================

    async function cekKartu() {

      if (!cardCode) {

        statusElement.textContent =
          "Kode kartu tidak ditemukan.";

        statusElement.classList.add("error");

        return;
      }


      try {

        const response = await fetch(
          `${SUPABASE_URL}/rest/v1/cards?card_code=eq.${encodeURIComponent(cardCode)}&select=*`,
          {
            method: "GET",

            headers: {
              "apikey": SUPABASE_KEY,
              "Authorization": `Bearer ${SUPABASE_KEY}`
            }
          }
        );


        const data = await response.json();


        if (!response.ok) {

          statusElement.textContent =
            "Terjadi kesalahan saat menghubungkan ke database.";

          statusElement.classList.add("error");

          console.log(data);

          return;
        }


        if (data.length === 0) {

          statusElement.textContent =
            "Kartu tidak ditemukan.";

          statusElement.classList.add("error");

          return;
        }


        kartu = data[0];


        // =========================
        // JIKA SUDAH AKTIF
        // =========================

        if (
          kartu.status === "active" &&
          kartu.target_url
        ) {

          statusElement.textContent =
            "Kartu aktif. Mengarahkan...";

          setTimeout(() => {

            window.location.href =
              kartu.target_url;

          }, 500);

          return;
        }


        // =========================
        // JIKA MASIH INACTIVE
        // =========================

        if (kartu.status === "inactive") {

          statusElement.textContent =
            "Kartu ditemukan. Status: INACTIVE";

          activateButton.style.display =
            "block";

          return;
        }


        // Status lainnya

        statusElement.textContent =
          "Status kartu: " + kartu.status;

      } catch (error) {

        console.error(error);

        statusElement.textContent =
          "Gagal terhubung ke server.";

        statusElement.classList.add("error");
      }
    }


    // =========================
    // AKTIVASI KARTU
    // =========================

    async function aktivasiKartu() {

      if (!cardCode) {
        return;
      }


      activateButton.disabled = true;

      activateButton.textContent =
        "MENGAKTIFKAN...";

      statusElement.textContent =
        "Sedang mengaktifkan kartu...";


      try {

        const response = await fetch(
          `${SUPABASE_URL}/rest/v1/cards?card_code=eq.${encodeURIComponent(cardCode)}`,
          {
            method: "PATCH",

            headers: {
              "apikey": SUPABASE_KEY,
              "Authorization": `Bearer ${SUPABASE_KEY}`,
              "Content-Type": "application/json",
              "Prefer": "return=representation"
            },

            body: JSON.stringify({
              status: "active"
            })
          }
        );


        const data = await response.json();


        if (!response.ok) {

          console.error(data);

          statusElement.textContent =
            "Gagal mengaktifkan kartu.";

          statusElement.classList.add("error");

          activateButton.disabled = false;

          activateButton.textContent =
            "AKTIVASI KARTU";

          return;
        }


        // =========================
        // BERHASIL
        // =========================

        statusElement.textContent =
          "Kartu berhasil diaktifkan!";

        statusElement.classList.remove("error");

        statusElement.classList.add("success");

        activateButton.style.display =
          "none";


        // Kalau target_url tersedia,
        // arahkan ke halaman tujuan

        if (
          data.length > 0 &&
          data[0].target_url
        ) {

          setTimeout(() => {

            window.location.href =
              data[0].target_url;

          }, 1000);

        }

      } catch (error) {

        console.error(error);

        statusElement.textContent =
          "Terjadi kesalahan saat aktivasi.";

        statusElement.classList.add("error");

        activateButton.disabled = false;

        activateButton.textContent =
          "AKTIVASI KARTU";
      }
    }


    activateButton.addEventListener(
      "click",
      aktivasiKartu
    );


    // Jalankan pengecekan

    cekKartu();

  </script>

</body>
</html>
